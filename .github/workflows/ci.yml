name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests and coverage
        run: npm test

      - name: Build
        run: npm run build

  github-pages-artifact:
    name: GitHub Pages artifact
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install
        run: npm ci

      - name: Build frontend for GitHub Pages
        env:
          VITE_EXTRACTOR_API_URL: ${{ vars.VITE_EXTRACTOR_API_URL }}
          VITE_BASE_PATH: /digest-deck/
        run: npm --workspace @digest-deck/shared run build && npm --workspace @digest-deck/web run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist
